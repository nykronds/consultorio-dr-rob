<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto y Citas - Profesional</title>
  <style>
    /* Estilos Generales y Movilidad */
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f8f9fa;
      color: #2c3e50;
    }

    /* Barra de Navegación */
    nav {
      background-color: #ffffff;
      padding: 15px 20px;
      display: flex;
      justify-content: center;
      gap: 30px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    nav a {
      text-decoration: none;
      color: #067a9fc9;
      font-weight: bold;
      text-transform: uppercase;
      font-size: 14px;
      transition: color 0.3s;
    }
    nav a:hover {
      color: #00495b; 
    }

    h1 { 
      font-size: 24px; 
      color: #29bdb1; 
      text-align: center; 
      margin: 20px 0; 
    }
    
    .main-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px 40px 20px;
    }

    .calendario-seccion {
      flex: 1.5;
      min-width: 320px;
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    form {
      flex: 1;
      min-width: 320px;
      background-color: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      border-top: 5px solid #00495b; 
    }

    form h2 { font-size: 18px; margin-top: 0; color: #00495b; display: center; align-items: center; gap: 8px; }
    
    .grid-form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    label { font-size: 12px; font-weight: bold; margin-bottom: 4px; display: block; }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ddd;
      font-size: 14px;
      box-sizing: border-box;
    }
    input:focus { border-color: #27ae60; outline: none; }

    .highlight-field {
      background-color: #e8f5e9;
      border: 1px solid #27ae60;
    }

    input[type="submit"] {
      grid-column: span 2;
      background-color: #f5565fd9; 
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
      padding: 15px;
      border-radius: 8px;
      margin-top: 10px;
      font-size: 16px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(245, 86, 95, 0.2);
    }

    input[type="submit"]:hover {
        background-color: #d43f48; 
        transform: translateY(-2px);
        box-shadow: 0 6px 15px rgba(245, 86, 95, 0.3);
    }

    input[type="submit"]:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    #mensaje-enviado {
      grid-column: span 2;
      font-size: 13px;
      display: none;
      padding: 10px;
      text-align: center;
      border-radius: 6px;
      margin-top: 10px;
    }

    @media (max-width: 600px) {
      .grid-form { grid-template-columns: 1fr; }
      input[type="submit"] { grid-column: span 1; }
      nav { gap: 15px; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="./">Inicio</a> 
    <a href="contacto.html">Contacto</a>
  </nav>

  <h1>Agendar Cita Médica</h1>

  <div class="main-container">
    
    <div class="calendario-seccion">
      <h3 style="color: #00495b; margin-top: 0;">1. Revisa disponibilidad</h3>
      <p style="font-size: 13px; color: #666;">Selecciona una hora libre y confírmala a la derecha.</p>
      
      <iframe id="googleCalendar" 
              src="https://calendar.google.com/calendar/embed?src=lainfoharley@gmail.com&ctz=America%2FMexico_City&mode=WEEK&hl=es&showNav=1&showPrint=0&showTabs=0&showCalendars=0" 
              style="border: 0" width="100%" height="450" frameborder="0" scrolling="no"></iframe>
    </div>

    <form id="miFormulario">
      <h2>2. Confirma tu Horario</h2>
      
      <div class="grid-form">
        <p style="grid-column: span 2; margin: 0;">
          <label>Nombre del Paciente:</label>
          <input type="text" name="nombre" placeholder="Ej. Juan Pérez" required>
        </p>

        <p style="margin: 0;">
          <label>Fecha de la Cita:</label>
          <input type="date" id="fechaCita" name="fecha" required class="highlight-field">
        </p>

        <p style="margin: 0;">
          <label>Hora:</label>
          <input type="time" id="horaCita" name="hora" required class="highlight-field">
        </p>

        <p style="margin: 0;">
          <label>Teléfono:</label>
          <input type="tel" name="telefono" placeholder="10 dígitos">
        </p>

        <p style="margin: 0;">
          <label>Edad:</label>
          <input type="number" name="edad" min="1" max="100" required>
        </p>

        <p style="grid-column: span 2; margin: 0;">
          <label>Correo Electrónico:</label>
          <input type="email" name="email" placeholder="paciente@correo.com" required>
        </p>

        <p style="grid-column: span 2; margin: 0;">
          <label>Motivo de consulta:</label>
          <textarea name="comentario" rows="3" placeholder="¿Cuál es el motivo de su consulta?" required></textarea>
        </p>
        
        <input type="submit" id="btnEnviar" value="Agendar Cita Ahora">
        
        <div id="mensaje-enviado"></div>
      </div>
    </form>

  </div>

  <script>
    const form = document.getElementById('miFormulario');
    const inputFecha = document.getElementById('fechaCita');
    const mensajeStatus = document.getElementById('mensaje-enviado');

    const hoy = new Date().toISOString().split('T')[0];
    inputFecha.setAttribute('min', hoy);
    inputFecha.value = hoy;

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      
      mensajeStatus.style.display = 'block';
      mensajeStatus.innerText = "⌛ Enviando datos y agendando...";
      mensajeStatus.style.backgroundColor = "#fff3cd";
      mensajeStatus.style.color = "#856404";
      document.getElementById('btnEnviar').disabled = true;

      const urlScript = "https://script.google.com/macros/s/AKfycbzRPpMXdR1JIpAsNy9qhCHbXz_SqpIAlUsRz7bhmTTUrX3qfhizxNsw81v-sL1L5ELN/exec"; 
      
      const formData = new FormData(form);
      const params = new URLSearchParams(formData).toString();
      const finalUrl = urlScript + "?" + params;

      fetch(finalUrl, { 
        method: 'GET',
        mode: 'no-cors' 
      })
      .then(() => {
        mensajeStatus.style.backgroundColor = "#d4edda";
        mensajeStatus.style.color = "#155724";
        mensajeStatus.innerText = "✅ ¡Cita procesada! Revisa tu calendario y correo.";
        form.reset();
        document.getElementById('btnEnviar').disabled = false;
        
        setTimeout(() => {
          document.getElementById('googleCalendar').src += '';
        }, 3000);
      })
      .catch((error) => {
        console.error("Error:", error);
        mensajeStatus.style.backgroundColor = "#f8d7da";
        mensajeStatus.style.color = "#721c24";
        mensajeStatus.innerText = "❌ Error de conexión. Inténtalo de nuevo.";
        document.getElementById('btnEnviar').disabled = false;
      });
    });
  </script>

</body>
</html>
